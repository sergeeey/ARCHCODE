[project]
name = "memgraph-research"
version = "0.1.0"
description = "Cross-project hypothesis transfer via research memory graphs"
authors = [{name = "Sergey Boyko", email = "sergeikuch80@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "neo4j>=5.25.0",
    "networkx>=3.4",
    "sentence-transformers>=3.3.1",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "tqdm>=4.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
