[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "archcode"
version = "0.1.0"
description = "Physics-informed discovery framework for 3D chromatin architecture and variant interpretation. Discovery Engine, not a Prediction Tool."
requires-python = ">=3.11"
authors = [
    { name = "Sergey V. Boyko", email = "sergey.boyko@ronininstitute.org" },
]
license = { text = "MIT" }
readme = "README.md"
keywords = [
    "chromatin",
    "variant interpretation",
    "ClinVar",
    "falsification",
    "AlphaGenome",
    "loop extrusion",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "python-docx>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=4.0"]
optimization = ["optuna>=3.0"]
dev = ["ruff>=0.1", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/sergeeey/ARCHCODE"
Preprint = "https://doi.org/10.21203/rs.3.rs-9090074/v1"
Reproducibility = "https://github.com/sergeeey/ARCHCODE/blob/main/REPRODUCE.md"
