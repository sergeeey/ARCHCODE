name: Publication Integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  publication-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS dependencies
        run: npm ci

      - name: Manuscript integrity
        run: python scripts/verify_manuscript.py

      - name: Results contract integrity
        run: python scripts/validate_results_contracts.py

      - name: Project canon integrity
        run: python scripts/validate_project_canon.py

      - name: Red-flag gate
        run: python check_redflags.py

      - name: Secret hygiene
        run: python scripts/secret_scan.py

      - name: Unit tests
        run: npm test
